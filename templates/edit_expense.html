<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>
</head>
<body>
    <h1>Expense Edit Karo</h1>

    <form method="POST">
        <label>Amount:</label><br>
        <input type="number" step="0.01" name="amount" value="{{ expense['amount'] }}" required><br><br>

        <label>Category:</label><br>
        <select name="category">
            {% for c in ["Food", "Travel", "Bills", "Shopping", "Other"] %}
            <option value="{{ c }}" {% if c == expense['category'] %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
        </select><br><br>

        <label>Date:</label><br>
        <input type="date" name="date" value="{{ expense['date'] }}" required><br><br>

        <label>Note:</label><br>
        <input type="text" name="note" value="{{ expense['note'] }}"><br><br>

        <button type="submit">Update</button>
    </form>

    <br>
    <a href="/expenses">Wapas jao</a>
</body>
</html>
